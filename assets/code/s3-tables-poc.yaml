AWSTemplateFormatVersion: '2010-09-09'
Description: "(SO9XXX) - Guidance for Deploying a PoC for Amazon S3 Tables. Deploys S3 table bucket, Athena workgroup, Firehose support, and optionally a SageMaker notebook for Spark/PyIceberg testing."

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: S3 Tables Configuration
        Parameters:
          - TableBucketName
      - Label:
          default: Notebook Configuration (Optional)
        Parameters:
          - DeployNotebook
          - NotebookInstanceType

Parameters:
  TableBucketName:
    Type: String
    Default: s3-tables-poc
    Description: Name for the S3 table bucket (account ID appended automatically).
    AllowedPattern: '[a-z0-9][a-z0-9\-]{1,61}[a-z0-9]'

  DeployNotebook:
    Type: String
    Default: "Yes"
    AllowedValues: ["Yes", "No"]
    Description: Deploy a SageMaker AI notebook instance with pre-configured IAM role for Spark/PyIceberg testing. Choose No if using a local IDE.

  NotebookInstanceType:
    Type: String
    Default: ml.t3.medium
    AllowedValues: [ml.t3.medium, ml.t3.large, ml.t3.xlarge]
    Description: SageMaker notebook instance type (only used if DeployNotebook = Yes).

Conditions:
  CreateNotebook: !Equals [!Ref DeployNotebook, "Yes"]

Resources:

  # ============ S3 TABLE BUCKET ============

  S3TableBucket:
    Type: AWS::S3Tables::TableBucket
    Properties:
      TableBucketName: !Sub "${TableBucketName}-${AWS::AccountId}"

  # ============ ATHENA ============

  AthenaResultsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "s3-tables-poc-athena-results-${AWS::AccountId}"
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-athena-results"

  AthenaWorkgroup:
    Type: AWS::Athena::WorkGroup
    Properties:
      Name: !Sub "${AWS::StackName}-workgroup"
      Description: Workgroup for S3 Tables PoC queries
      State: ENABLED
      WorkGroupConfiguration:
        ResultConfiguration:
          OutputLocation: !Sub "s3://${AthenaResultsBucket}/results/"
        EnforceWorkGroupConfiguration: false
        PublishCloudWatchMetricsEnabled: true

  # ============ FIREHOSE SUPPORT ============

  FirehoseBackupBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "s3-tables-poc-firehose-backup-${AWS::AccountId}"
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: ExpireBackupData
            Status: Enabled
            ExpirationInDays: 7
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-firehose-backup"

  FirehoseRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${AWS::StackName}-firehose-role"
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: firehose.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                sts:ExternalId: !Ref AWS::AccountId
      Policies:
        - PolicyName: FirehoseS3TablesAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: S3TablesWrite
                Effect: Allow
                Action:
                  - s3tables:GetTableData
                  - s3tables:PutTableData
                  - s3tables:GetTable
                  - s3tables:GetTableMetadataLocation
                  - s3tables:UpdateTableMetadataLocation
                  - s3tables:GetNamespace
                  - s3tables:GetTableBucket
                Resource:
                  - !Sub "arn:aws:s3tables:${AWS::Region}:${AWS::AccountId}:bucket/${TableBucketName}-${AWS::AccountId}"
                  - !Sub "arn:aws:s3tables:${AWS::Region}:${AWS::AccountId}:bucket/${TableBucketName}-${AWS::AccountId}/*"
              - Sid: GlueCatalogAccess
                Effect: Allow
                Action:
                  - glue:GetTable
                  - glue:GetDatabase
                  - glue:GetDatabases
                  - glue:GetCatalog
                  - glue:GetPartitions
                  - glue:BatchGetPartition
                  - glue:UpdateTable
                Resource: "*"
              - Sid: FirehoseBackupBucket
                Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:GetObject
                  - s3:ListBucket
                  - s3:GetBucketLocation
                  - s3:AbortMultipartUpload
                Resource:
                  - !Sub "arn:aws:s3:::s3-tables-poc-firehose-backup-${AWS::AccountId}"
                  - !Sub "arn:aws:s3:::s3-tables-poc-firehose-backup-${AWS::AccountId}/*"
              - Sid: CloudWatchLogs
                Effect: Allow
                Action:
                  - logs:PutLogEvents
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                Resource: !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/firehose/${AWS::StackName}-stream:*"

  # ============ SAGEMAKER NOTEBOOK (CONDITIONAL) ============

  NotebookRole:
    Type: AWS::IAM::Role
    Condition: CreateNotebook
    Properties:
      RoleName: !Sub "${AWS::StackName}-notebook-role"
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: sagemaker.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: NotebookS3TablesAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: S3TablesFullAccess
                Effect: Allow
                Action:
                  - s3tables:*
                Resource:
                  - !Sub "arn:aws:s3tables:${AWS::Region}:${AWS::AccountId}:bucket/${TableBucketName}-${AWS::AccountId}"
                  - !Sub "arn:aws:s3tables:${AWS::Region}:${AWS::AccountId}:bucket/${TableBucketName}-${AWS::AccountId}/*"
              - Sid: GlueCatalogRead
                Effect: Allow
                Action:
                  - glue:GetCatalog
                  - glue:GetCatalogs
                  - glue:GetDatabase
                  - glue:GetDatabases
                  - glue:GetTable
                  - glue:GetTables
                  - glue:GetPartitions
                  - glue:BatchGetPartition
                Resource: "*"
              - Sid: AthenaQuery
                Effect: Allow
                Action:
                  - athena:StartQueryExecution
                  - athena:GetQueryExecution
                  - athena:GetQueryResults
                  - athena:GetWorkGroup
                Resource:
                  - !Sub "arn:aws:athena:${AWS::Region}:${AWS::AccountId}:workgroup/${AWS::StackName}-workgroup"
              - Sid: S3AthenaResults
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:ListBucket
                  - s3:GetBucketLocation
                Resource:
                  - !Sub "arn:aws:s3:::s3-tables-poc-athena-results-${AWS::AccountId}"
                  - !Sub "arn:aws:s3:::s3-tables-poc-athena-results-${AWS::AccountId}/*"
              - Sid: CloudWatchMetrics
                Effect: Allow
                Action:
                  - cloudwatch:GetMetricStatistics
                  - cloudwatch:GetMetricData
                  - cloudwatch:ListMetrics
                Resource: "*"
              - Sid: CloudFormationDescribe
                Effect: Allow
                Action:
                  - cloudformation:DescribeStacks
                Resource:
                  - !Sub "arn:aws:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${AWS::StackName}/*"

  NotebookLifecycleConfig:
    Type: AWS::SageMaker::NotebookInstanceLifecycleConfig
    Condition: CreateNotebook
    Properties:
      NotebookInstanceLifecycleConfigName: !Sub "${AWS::StackName}-lifecycle"
      OnStart:
        - Content:
            Fn::Base64: |
              #!/bin/bash
              set -e
              # Install PyIceberg and dependencies (AL2023 notebook uses system Python)
              sudo -u ec2-user -i <<'EOF'
              pip install -q "pyiceberg[s3,pyarrow]" boto3 pyarrow pandas
              EOF

  NotebookInstance:
    Type: AWS::SageMaker::NotebookInstance
    Condition: CreateNotebook
    Properties:
      NotebookInstanceName: !Sub "${AWS::StackName}-notebook"
      InstanceType: !Ref NotebookInstanceType
      RoleArn: !GetAtt NotebookRole.Arn
      LifecycleConfigName: !GetAtt NotebookLifecycleConfig.NotebookInstanceLifecycleConfigName
      PlatformIdentifier: notebook-al2023-v1
      VolumeSizeInGB: 20
      DirectInternetAccess: Enabled
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-notebook"

Outputs:
  TableBucketARN:
    Description: ARN of the S3 table bucket
    Value: !GetAtt S3TableBucket.TableBucketARN

  TableBucketName:
    Description: Name of the S3 table bucket
    Value: !Sub "${TableBucketName}-${AWS::AccountId}"

  AthenaWorkgroupName:
    Description: Athena workgroup name
    Value: !Ref AthenaWorkgroup

  AthenaResultsBucketName:
    Description: S3 bucket for Athena query results
    Value: !Ref AthenaResultsBucket

  FirehoseBackupBucketName:
    Description: S3 bucket for Firehose error/backup records
    Value: !Ref FirehoseBackupBucket

  FirehoseRoleArn:
    Description: IAM role ARN for Firehose delivery stream
    Value: !GetAtt FirehoseRole.Arn

  NotebookUrl:
    Condition: CreateNotebook
    Description: URL to open the SageMaker notebook in JupyterLab
    Value: !Sub "https://${AWS::StackName}-notebook.notebook.${AWS::Region}.sagemaker.aws/lab"

  NotebookName:
    Condition: CreateNotebook
    Description: SageMaker notebook instance name
    Value: !Sub "${AWS::StackName}-notebook"

  Region:
    Description: Deployment region
    Value: !Ref AWS::Region
