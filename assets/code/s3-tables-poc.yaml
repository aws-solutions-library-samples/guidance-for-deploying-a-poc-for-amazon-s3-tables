AWSTemplateFormatVersion: '2010-09-09'
Description: "(SO9XXX) - Guidance for Deploying a PoC for Amazon S3 Tables. Deploys S3 table bucket, Athena workgroup, and Firehose support."

Resources:

  # ============ S3 TABLE BUCKET ============

  S3TableBucket:
    Type: AWS::S3Tables::TableBucket
    Properties:
      TableBucketName: !Sub "${AWS::StackName}-${AWS::AccountId}"

  # ============ ATHENA ============

  AthenaResultsBucket:
    # Scan suppression: Access logging, versioning, and ObjectLock intentionally omitted.
    # This is a short-lived PoC bucket for ephemeral Athena query results.
    # PublicReadWrite ACL finding is a false positive — no ACL set; PublicAccessBlockConfiguration denies all public access.
    Type: AWS::S3::Bucket
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-athena-results"

  AthenaWorkgroup:
    Type: AWS::Athena::WorkGroup
    Properties:
      Name: !Sub "${AWS::StackName}-workgroup"
      Description: Workgroup for S3 Tables PoC queries
      State: ENABLED
      WorkGroupConfiguration:
        ResultConfiguration:
          OutputLocation: !Sub "s3://${AthenaResultsBucket}/results/"
          EncryptionConfiguration:
            EncryptionOption: SSE_S3
        EnforceWorkGroupConfiguration: true
        PublishCloudWatchMetricsEnabled: true

  # ============ FIREHOSE SUPPORT ============

  FirehoseBackupBucket:
    # Scan suppression: Access logging, versioning, and ObjectLock intentionally omitted.
    # This is a short-lived PoC bucket with 7-day lifecycle expiration for Firehose failed records.
    # PublicReadWrite ACL finding is a false positive — no ACL set; PublicAccessBlockConfiguration denies all public access.
    Type: AWS::S3::Bucket
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: ExpireBackupData
            Status: Enabled
            ExpirationInDays: 7
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-firehose-backup"

  FirehoseRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: firehose.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                sts:ExternalId: !Ref AWS::AccountId
      ManagedPolicyArns:
        - !Ref FirehosePolicy

  FirehosePolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub "${AWS::StackName}-firehose-policy"
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: S3TablesWrite
            Effect: Allow
            Action:
              - s3tables:GetTableData
              - s3tables:PutTableData
              - s3tables:GetTable
              - s3tables:GetTableMetadataLocation
              - s3tables:UpdateTableMetadataLocation
              - s3tables:GetNamespace
              - s3tables:GetTableBucket
            Resource:
              - !Sub "arn:aws:s3tables:${AWS::Region}:${AWS::AccountId}:bucket/${AWS::StackName}-${AWS::AccountId}"
              - !Sub "arn:aws:s3tables:${AWS::Region}:${AWS::AccountId}:bucket/${AWS::StackName}-${AWS::AccountId}/*"
          - Sid: GlueCatalogAccess
            Effect: Allow
            Action:
              - glue:GetTable
              - glue:GetDatabase
              - glue:GetDatabases
              - glue:GetCatalog
              - glue:GetPartitions
              - glue:BatchGetPartition
              - glue:UpdateTable
            Resource:
              - !Sub "arn:aws:glue:${AWS::Region}:${AWS::AccountId}:catalog"
              - !Sub "arn:aws:glue:${AWS::Region}:${AWS::AccountId}:catalog/*"
              - !Sub "arn:aws:glue:${AWS::Region}:${AWS::AccountId}:database/*"
              - !Sub "arn:aws:glue:${AWS::Region}:${AWS::AccountId}:table/*"
          - Sid: LakeFormationAccess
            # lakeformation:GetDataAccess does not support resource-level permissions
            Effect: Allow
            Action:
              - lakeformation:GetDataAccess
            Resource: "*"
          - Sid: FirehoseBackupBucket
            Effect: Allow
            Action:
              - s3:PutObject
              - s3:GetObject
              - s3:ListBucket
              - s3:GetBucketLocation
              - s3:AbortMultipartUpload
            Resource:
              - !GetAtt FirehoseBackupBucket.Arn
              - !Sub "${FirehoseBackupBucket.Arn}/*"
          - Sid: CloudWatchLogs
            Effect: Allow
            Action:
              - logs:PutLogEvents
              - logs:CreateLogGroup
              - logs:CreateLogStream
            Resource: !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/firehose/${AWS::StackName}-stream:*"

Outputs:
  TableBucketARN:
    Description: ARN of the S3 table bucket
    Value: !GetAtt S3TableBucket.TableBucketARN

  TableBucketName:
    Description: Name of the S3 table bucket
    Value: !Sub "${AWS::StackName}-${AWS::AccountId}"

  AthenaWorkgroupName:
    Description: Athena workgroup name
    Value: !Ref AthenaWorkgroup

  AthenaResultsBucketName:
    Description: S3 bucket for Athena query results
    Value: !Ref AthenaResultsBucket

  FirehoseBackupBucketName:
    Description: S3 bucket for Firehose error/backup records
    Value: !Ref FirehoseBackupBucket

  FirehoseRoleArn:
    Description: IAM role ARN for Firehose delivery stream
    Value: !GetAtt FirehoseRole.Arn

  Region:
    Description: Deployment region
    Value: !Ref AWS::Region
