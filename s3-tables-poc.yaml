AWSTemplateFormatVersion: '2010-09-09'
Description: "(SO9XXX) - Guidance for Deploying a PoC for Amazon S3 Tables. Template deploys a VPC with private subnet (VPC endpoints, no NAT Gateway), EC2 instance (SSM access), S3 table bucket, Athena workgroup, and required IAM roles."

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: EC2 Configuration
        Parameters:
          - InstanceType
      - Label:
          default: S3 Tables Configuration
        Parameters:
          - TableBucketName
          - DefaultNamespace

Parameters:
  InstanceType:
    Type: String
    Default: t3.xlarge
    AllowedValues: [t3.large, t3.xlarge, t3.2xlarge, m5.xlarge, m5.2xlarge]
    Description: EC2 instance type for the test host.

  TableBucketName:
    Type: String
    Default: s3-tables-poc
    Description: Name for the S3 table bucket.
    AllowedPattern: '[a-z0-9][a-z0-9\-]{1,61}[a-z0-9]'

  DefaultNamespace:
    Type: String
    Default: poc_data
    Description: Default namespace to create in the table bucket.

Resources:

  # ============ NETWORKING ============

  VPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-vpc"

  PrivateSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.2.0/24
      MapPublicIpOnLaunch: false
      AvailabilityZone: !Select [0, !GetAZs '']
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-private-subnet"

  PrivateRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-private-rt"

  PrivateSubnetRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnet
      RouteTableId: !Ref PrivateRouteTable

  # ============ VPC ENDPOINTS ============

  # Gateway endpoint for S3 (free)
  S3GatewayEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref VPC
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.s3"
      VpcEndpointType: Gateway
      RouteTableIds:
        - !Ref PrivateRouteTable

  # Interface endpoints for SSM Session Manager
  EndpointSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for VPC interface endpoints
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 10.0.0.0/16
          Description: HTTPS from VPC
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-endpoint-sg"

  SSMEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref VPC
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.ssm"
      VpcEndpointType: Interface
      PrivateDnsEnabled: true
      SubnetIds:
        - !Ref PrivateSubnet
      SecurityGroupIds:
        - !Ref EndpointSecurityGroup

  SSMMessagesEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref VPC
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.ssmmessages"
      VpcEndpointType: Interface
      PrivateDnsEnabled: true
      SubnetIds:
        - !Ref PrivateSubnet
      SecurityGroupIds:
        - !Ref EndpointSecurityGroup

  EC2MessagesEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref VPC
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.ec2messages"
      VpcEndpointType: Interface
      PrivateDnsEnabled: true
      SubnetIds:
        - !Ref PrivateSubnet
      SecurityGroupIds:
        - !Ref EndpointSecurityGroup

  # Interface endpoint for S3 Tables API
  S3TablesEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref VPC
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.s3tables"
      VpcEndpointType: Interface
      PrivateDnsEnabled: true
      SubnetIds:
        - !Ref PrivateSubnet
      SecurityGroupIds:
        - !Ref EndpointSecurityGroup

  # Interface endpoint for Glue
  GlueEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref VPC
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.glue"
      VpcEndpointType: Interface
      PrivateDnsEnabled: true
      SubnetIds:
        - !Ref PrivateSubnet
      SecurityGroupIds:
        - !Ref EndpointSecurityGroup

  # Interface endpoint for Athena
  AthenaEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref VPC
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.athena"
      VpcEndpointType: Interface
      PrivateDnsEnabled: true
      SubnetIds:
        - !Ref PrivateSubnet
      SecurityGroupIds:
        - !Ref EndpointSecurityGroup

  # ============ SECURITY ============

  EC2SecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for S3 Tables PoC EC2 instance (no inbound, SSM only)
      VpcId: !Ref VPC
      SecurityGroupEgress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
          Description: HTTPS to AWS services via VPC endpoints and S3 gateway
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-ec2-sg"

  # ============ IAM ============

  EC2Role:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${AWS::StackName}-ec2-role"
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Policies:
        - PolicyName: S3TablesAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: S3TablesFullAccess
                Effect: Allow
                Action:
                  - s3tables:*
                Resource: "*"
              - Sid: S3Access
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:ListBucket
                  - s3:GetBucketLocation
                Resource: "*"
              - Sid: GlueAccess
                Effect: Allow
                Action:
                  - glue:GetDatabase
                  - glue:GetDatabases
                  - glue:GetTable
                  - glue:GetTables
                  - glue:GetPartitions
                  - glue:BatchGetPartition
                  - glue:GetCatalog
                  - glue:GetCatalogs
                Resource: "*"
              - Sid: AthenaAccess
                Effect: Allow
                Action:
                  - athena:StartQueryExecution
                  - athena:GetQueryExecution
                  - athena:GetQueryResults
                  - athena:GetWorkGroup
                Resource: "*"
              - Sid: LakeFormationAccess
                Effect: Allow
                Action:
                  - lakeformation:GetDataAccess
                Resource: "*"

  EC2InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - !Ref EC2Role

  # ============ S3 (Athena Results + Spark Staging) ============

  AthenaResultsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "${AWS::StackName}-athena-results-${AWS::AccountId}"
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-athena-results"

  # ============ S3 TABLE BUCKET ============

  S3TableBucket:
    Type: AWS::S3Tables::TableBucket
    Properties:
      TableBucketName: !Sub "${TableBucketName}-${AWS::AccountId}"

  # ============ SAGEMAKER LAKEHOUSE INTEGRATION ============

  S3TablesCatalog:
    Type: AWS::Glue::Catalog
    DependsOn: S3TableBucket
    Properties:
      Name: s3tablescatalog
      CatalogInput:
        FederatedCatalog:
          Identifier: !Sub "arn:aws:s3tables:${AWS::Region}:${AWS::AccountId}:bucket/*"
          ConnectionName: "aws:s3tables"
        CreateDatabaseDefaultPermissions:
          - Principal:
              DataLakePrincipalIdentifier: IAM_ALLOWED_PRINCIPALS
            Permissions:
              - ALL
        CreateTableDefaultPermissions:
          - Principal:
              DataLakePrincipalIdentifier: IAM_ALLOWED_PRINCIPALS
            Permissions:
              - ALL
        AllowFullTableExternalDataAccess: "True"

  # ============ ATHENA ============

  AthenaWorkgroup:
    Type: AWS::Athena::WorkGroup
    Properties:
      Name: !Sub "${AWS::StackName}-workgroup"
      Description: Workgroup for S3 Tables PoC queries
      State: ENABLED
      WorkGroupConfiguration:
        ResultConfiguration:
          OutputLocation: !Sub "s3://${AthenaResultsBucket}/results/"
        EnforceWorkGroupConfiguration: false
        PublishCloudWatchMetricsEnabled: true

  # ============ EC2 INSTANCE ============

  EC2Instance:
    Type: AWS::EC2::Instance
    DependsOn:
      - S3GatewayEndpoint
      - SSMEndpoint
      - SSMMessagesEndpoint
      - EC2MessagesEndpoint
    Properties:
      InstanceType: !Ref InstanceType
      SubnetId: !Ref PrivateSubnet
      SecurityGroupIds:
        - !Ref EC2SecurityGroup
      IamInstanceProfile: !Ref EC2InstanceProfile
      ImageId: !Sub "{{resolve:ssm:/aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64}}"
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            VolumeSize: 50
            VolumeType: gp3
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash -xe
          # Note: yum repos and Spark tarball must be pre-staged in S3
          # since this instance has no internet access (VPC endpoints only).
          # Java 17 and SSM agent are included in the AL2023 AMI.

          # Signal completion
          echo "S3 Tables PoC instance ready (install Spark via S3 staging)" > /tmp/setup-complete.txt
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-test-host"

Outputs:
  EC2InstanceId:
    Description: EC2 Instance ID (use with SSM Session Manager to connect)
    Value: !Ref EC2Instance

  SSMSessionCommand:
    Description: AWS CLI command to connect to the EC2 instance via Session Manager
    Value: !Sub "aws ssm start-session --target ${EC2Instance} --region ${AWS::Region}"

  TableBucketARN:
    Description: ARN of the S3 table bucket
    Value: !GetAtt S3TableBucket.TableBucketARN

  TableBucketName:
    Description: Name of the S3 table bucket
    Value: !Sub "${TableBucketName}-${AWS::AccountId}"

  AthenaWorkgroupName:
    Description: Name of the Athena workgroup
    Value: !Ref AthenaWorkgroup

  AthenaResultsBucketName:
    Description: S3 bucket for Athena query results (also used for Spark staging)
    Value: !Ref AthenaResultsBucket

  DefaultNamespace:
    Description: Default namespace for tables
    Value: !Ref DefaultNamespace

  Region:
    Description: Deployment Region
    Value: !Ref AWS::Region
