AWSTemplateFormatVersion: '2010-09-09'
Description: "(SO9XXX) - Guidance for Deploying a PoC for Amazon S3 Tables. Template deploys a VPC, EC2 instance, S3 table bucket, Athena workgroup, and required IAM roles."

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: EC2 Configuration
        Parameters:
          - KeyPairName
          - InstanceType
          - AllowedSSHCidr
      - Label:
          default: S3 Tables Configuration
        Parameters:
          - TableBucketName
          - DefaultNamespace

Parameters:
  KeyPairName:
    Type: AWS::EC2::KeyPair::KeyName
    Description: Name of an existing EC2 key pair for SSH access.

  InstanceType:
    Type: String
    Default: t3.xlarge
    AllowedValues: [t3.large, t3.xlarge, t3.2xlarge, m5.xlarge, m5.2xlarge]
    Description: EC2 instance type for the test host.

  AllowedSSHCidr:
    Type: String
    Default: 0.0.0.0/0
    Description: CIDR block allowed for SSH access. Restrict to your IP (e.g., 203.0.113.10/32).
    AllowedPattern: '(\d{1,3}\.){3}\d{1,3}/\d{1,2}'

  TableBucketName:
    Type: String
    Default: s3-tables-poc
    Description: Name for the S3 table bucket.
    AllowedPattern: '[a-z0-9][a-z0-9\-]{1,61}[a-z0-9]'

  DefaultNamespace:
    Type: String
    Default: poc_data
    Description: Default namespace to create in the table bucket.

Resources:

  # ============ NETWORKING ============

  VPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-vpc"

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-igw"

  AttachGateway:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref VPC
      InternetGatewayId: !Ref InternetGateway

  PublicSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.1.0/24
      MapPublicIpOnLaunch: true
      AvailabilityZone: !Select [0, !GetAZs '']
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-public-subnet"

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-public-rt"

  PublicRoute:
    Type: AWS::EC2::Route
    DependsOn: AttachGateway
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  SubnetRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet
      RouteTableId: !Ref PublicRouteTable

  # ============ SECURITY ============

  EC2SecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for S3 Tables PoC EC2 instance
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: !Ref AllowedSSHCidr
          Description: SSH access
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0
          Description: Allow all outbound
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-ec2-sg"

  # ============ IAM ============

  EC2Role:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${AWS::StackName}-ec2-role"
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Policies:
        - PolicyName: S3TablesAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: S3TablesFullAccess
                Effect: Allow
                Action:
                  - s3tables:*
                Resource: "*"
              - Sid: S3Access
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:ListBucket
                  - s3:GetBucketLocation
                Resource: "*"
              - Sid: GlueAccess
                Effect: Allow
                Action:
                  - glue:GetDatabase
                  - glue:GetDatabases
                  - glue:GetTable
                  - glue:GetTables
                  - glue:GetPartitions
                  - glue:BatchGetPartition
                Resource: "*"
              - Sid: AthenaAccess
                Effect: Allow
                Action:
                  - athena:StartQueryExecution
                  - athena:GetQueryExecution
                  - athena:GetQueryResults
                  - athena:GetWorkGroup
                Resource: "*"
              - Sid: LakeFormationAccess
                Effect: Allow
                Action:
                  - lakeformation:GetDataAccess
                Resource: "*"

  EC2InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - !Ref EC2Role

  # ============ S3 (Athena Results) ============

  AthenaResultsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "${AWS::StackName}-athena-results-${AWS::AccountId}"
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-athena-results"

  # ============ S3 TABLE BUCKET ============

  S3TableBucket:
    Type: AWS::S3Tables::TableBucket
    Properties:
      TableBucketName: !Sub "${TableBucketName}-${AWS::AccountId}"

  # ============ ATHENA ============

  AthenaWorkgroup:
    Type: AWS::Athena::WorkGroup
    Properties:
      Name: !Sub "${AWS::StackName}-workgroup"
      Description: Workgroup for S3 Tables PoC queries
      State: ENABLED
      WorkGroupConfiguration:
        ResultConfiguration:
          OutputLocation: !Sub "s3://${AthenaResultsBucket}/results/"
        EnforceWorkGroupConfiguration: false
        PublishCloudWatchMetricsEnabled: true

  # ============ EC2 INSTANCE ============

  EC2Instance:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: !Ref InstanceType
      KeyName: !Ref KeyPairName
      SubnetId: !Ref PublicSubnet
      SecurityGroupIds:
        - !Ref EC2SecurityGroup
      IamInstanceProfile: !Ref EC2InstanceProfile
      ImageId: !Sub "{{resolve:ssm:/aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64}}"
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            VolumeSize: 50
            VolumeType: gp3
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash -xe
          yum update -y
          yum install -y java-17-amazon-corretto python3-pip
          pip3 install awscli --upgrade

          # Install Apache Spark for local testing
          cd /opt
          wget -q https://archive.apache.org/dist/spark/spark-3.5.1/spark-3.5.1-bin-hadoop3.tgz
          tar xzf spark-3.5.1-bin-hadoop3.tgz
          ln -s spark-3.5.1-bin-hadoop3 spark

          echo 'export SPARK_HOME=/opt/spark' >> /etc/profile.d/spark.sh
          echo 'export PATH=$SPARK_HOME/bin:$PATH' >> /etc/profile.d/spark.sh
          echo 'export JAVA_HOME=/usr/lib/jvm/java-17-amazon-corretto' >> /etc/profile.d/spark.sh

          # Signal completion
          echo "S3 Tables PoC instance setup complete" > /tmp/setup-complete.txt
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-test-host"

Outputs:
  EC2PublicIP:
    Description: Public IP of the EC2 test host
    Value: !GetAtt EC2Instance.PublicIp

  EC2InstanceId:
    Description: EC2 Instance ID
    Value: !Ref EC2Instance

  TableBucketARN:
    Description: ARN of the S3 table bucket
    Value: !GetAtt S3TableBucket.TableBucketARN

  TableBucketName:
    Description: Name of the S3 table bucket
    Value: !Sub "${TableBucketName}-${AWS::AccountId}"

  AthenaWorkgroupName:
    Description: Name of the Athena workgroup
    Value: !Ref AthenaWorkgroup

  AthenaResultsBucketName:
    Description: S3 bucket for Athena query results
    Value: !Ref AthenaResultsBucket

  DefaultNamespace:
    Description: Default namespace for tables
    Value: !Ref DefaultNamespace

  SSHCommand:
    Description: SSH command to connect to the EC2 instance
    Value: !Sub "ssh -i <your-key>.pem ec2-user@${EC2Instance.PublicIp}"

  Region:
    Description: Deployment Region
    Value: !Ref AWS::Region

  PublicSubnetId:
    Description: Public subnet ID (use for optional EMR cluster in Scenario 4b)
    Value: !Ref PublicSubnet
